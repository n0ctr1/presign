name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only. This workflow builds and tests; nothing it runs needs a token that
# can write to the repository, and a workflow that cannot write cannot be
# turned into one that pushes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit rather than by tag: a tag is a pointer its owner can
      # move, which is how a compromised action reaches every workflow that
      # trusted the name.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test --workspaces --if-present
