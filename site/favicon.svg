<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="presign">
  <!--
    The site's ink tile with a hairline edge, carrying the same single-stroke p
    as the logo. Light mode swaps the plate for the paper the page prints its
    verdict stamps on; browsers that ignore the query keep the dark plate, which
    is the one a tab strip usually sits on anyway.
  -->
  <style>
    .plate { fill: #0A0E1A; }
    .edge  { stroke: #2E3C58; }
    .mark  { fill: #8B6BFF; }
    @media (prefers-color-scheme: light) {
      .plate { fill: #E9E3D5; }
      .edge  { stroke: #C9C0AB; }
      .mark  { fill: #6B45F5; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7"/>
